<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Pooja Decor</title>
<style>
html,body{height:100%;margin:0;background:transparent;overflow:hidden;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#pattai{position:fixed;left:50%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
#bell{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:72px;height:100px;padding:0;border:0;background:transparent;pointer-events:auto;touch-action:none;user-select:none;cursor:grab}
#bell:active,#bell.dragging{cursor:grabbing}
#bell svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5));transform-origin:50% 14%}
#bell.ringing svg{animation:bell-swing .42s ease-in-out}
@keyframes bell-swing{0%,100%{transform:rotate(0)}18%{transform:rotate(-22deg)}42%{transform:rotate(18deg)}65%{transform:rotate(-12deg)}82%{transform:rotate(7deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="pattai" viewBox="0 0 160 100" aria-hidden="true">
<defs>
<linearGradient id="ash" x1="0" x2="1"><stop offset="0" stop-color="#d4ccbb"/><stop offset=".5" stop-color="#fbf8f1"/><stop offset="1" stop-color="#cfc6b4"/></linearGradient>
<radialGradient id="kk" cx=".38" cy=".35"><stop offset="0" stop-color="#ff5a4a"/><stop offset="1" stop-color="#a30b12"/></radialGradient>
</defs>
<line x1="80" y1="0" x2="80" y2="9" stroke="#c99a3a" stroke-width="2"/>
<g fill="none" stroke="url(#ash)" stroke-width="10" stroke-linecap="round">
<path d="M18 24 Q80 17 142 24"/><path d="M13 45 Q80 38 147 45"/><path d="M20 66 Q80 59 140 66"/>
</g>
<circle cx="80" cy="89" r="8.5" fill="url(#kk)"/>
</svg>
<button id="bell" type="button" aria-label="Puja bell. Click to ring, or drag side to side to shake." title="Click to ring · Drag side to side to shake">
<svg viewBox="0 0 80 112" aria-hidden="true">
<defs>
<linearGradient id="bellBrass" x1="0" x2="1"><stop offset="0" stop-color="#7c4515"/><stop offset=".2" stop-color="#d99a2e"/><stop offset=".43" stop-color="#fff0a2"/><stop offset=".68" stop-color="#c27a1b"/><stop offset="1" stop-color="#70400f"/></linearGradient>
<linearGradient id="bellRim" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ffe89a"/><stop offset="1" stop-color="#9e5d14"/></linearGradient>
<radialGradient id="bellRuby" cx=".35" cy=".3"><stop stop-color="#ffb060"/><stop offset="1" stop-color="#9c1520"/></radialGradient>
</defs>
<path d="M34 14c0-5 3-8 6-8s6 3 6 8v5c0 4 3 6 7 9l-5 5H32l-5-5c4-3 7-5 7-9z" fill="url(#bellBrass)" stroke="#74420f" stroke-width="1.5"/>
<path d="M25 31c-8 7-10 19-12 31-1 8-4 13-8 17v5h70v-5c-4-4-7-9-8-17-2-12-4-24-12-31-6 4-24 4-30 0z" fill="url(#bellBrass)" stroke="#74420f" stroke-width="1.7"/>
<path d="M16 64c13 5 35 5 48 0M10 78c15 6 45 6 60 0" fill="none" stroke="url(#bellRim)" stroke-width="3"/>
<path d="M28 40c-4 8-5 16-6 24" fill="none" stroke="rgba(255,244,190,.75)" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="40" cy="54" r="5" fill="url(#bellRuby)" stroke="#8f5111" stroke-width="1.2"/>
<path d="M40 82v12" stroke="#70400f" stroke-width="3"/>
<path d="M35 97q5-4 10 0l4 7q-9 5-18 0z" fill="url(#bellBrass)" stroke="#74420f" stroke-width="1.3"/>
<ellipse cx="40" cy="104" rx="9" ry="3" fill="url(#bellRim)"/>
</svg>
</button>
<script src="renderer.js"></script>
</body>
</html>
